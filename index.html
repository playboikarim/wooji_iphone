<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>우지의 아이폰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0e0e12 radial-gradient(circle at 30% 20%,#2a2440,#0e0e12 60%);display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;color:#000;user-select:none;-webkit-user-select:none}
.phone{width:414px;height:868px;border-radius:62px;padding:12px;background:#1c1c1f;box-shadow:0 0 0 2px #3a3a3e,0 0 0 6px #111,0 40px 90px rgba(0,0,0,.6);flex-shrink:0;transform-origin:center}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#000}
@media (max-width:500px){.phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}

/* status bar */
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 42px;font-weight:600;font-size:16px;z-index:90;color:#fff;pointer-events:none;transition:color .3s}
.sb .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:122px;height:36px;background:#000;border-radius:20px;z-index:95}
.hbar{position:absolute;bottom:0;left:0;right:0;height:30px;z-index:90;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;cursor:pointer}
.hbar i{width:136px;height:5px;border-radius:3px;background:#fff;transition:background .3s}
.screen.ui-dark .sb{color:#000}.screen.ui-dark .hbar i{background:#000}
.screen.on-lock .hbar{display:none}

/* wallpaper */
.wall{position:absolute;inset:0;background:var(--wall);background-size:cover;background-position:center}

/* lock */
#lock{position:absolute;inset:0;z-index:80;color:#fff;background:linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08)),var(--wall);background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;padding-top:76px;transition:transform .5s cubic-bezier(.3,.7,.2,1);touch-action:none}
#lock.gone{transform:translateY(-105%)}
.lk-date{font-size:20px;font-weight:600;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.15)}
.lk-time{font-size:96px;font-weight:700;letter-spacing:-3px;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.15)}
.notis{width:100%;padding:0 12px;margin-top:auto;margin-bottom:130px;display:flex;flex-direction:column;gap:8px}
.noti{background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-radius:22px;padding:12px 14px;display:flex;gap:11px;align-items:center;color:#111;cursor:pointer;animation:drop .5s backwards}
.noti .ni{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:21px;flex-shrink:0}
.noti b{font-size:15px}.noti p{font-size:15px;line-height:1.25}.noti small{margin-left:auto;font-size:13px;opacity:.6;align-self:flex-start}
.noti .nt{display:flex;flex:1;min-width:0;flex-direction:column}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.lk-btns{position:absolute;bottom:52px;left:46px;right:46px;display:flex;justify-content:space-between}
.lk-btns span{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;font-size:21px}
.lk-hint{position:absolute;bottom:20px;font-size:14px;font-weight:500;opacity:.9;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}

/* home */
#home{position:absolute;inset:0;padding:70px 24px 0;transition:transform .4s,filter .4s}
#home.behind{transform:scale(.92);filter:blur(3px) brightness(.8)}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.wg{height:158px;border-radius:24px;overflow:hidden;position:relative;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.wg.dday{display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.wg.dday:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.45))}
.wg.dday *{position:relative}
.wg.dday small{font-size:12px;opacity:.9}.wg.dday b{font-size:28px;letter-spacing:-.5px}
.wg.dday .em{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:54px}
.wg.cal{background:#fff;color:#000;padding:14px 16px}
.wg.cal .m{color:#ff3b30;font-size:13px;font-weight:700}.wg.cal .d{font-size:44px;font-weight:300;line-height:1.1}
.wg.cal .ev{font-size:12.5px;border-left:3px solid #ff2d55;padding-left:7px;margin-top:8px;line-height:1.35}
.wg.cal .ev small{color:#8e8e93}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;justify-items:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#fff;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.25);position:relative}
.ic .i{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:31px;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .15s;text-shadow:none;overflow:hidden}
.ic:active .i{transform:scale(.88);filter:brightness(.8)}
.ic .bdg{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:13px;min-width:23px;height:23px;border-radius:12px;display:grid;place-items:center;padding:0 6px;font-weight:600;text-shadow:none}
.i.calic{background:#fff;color:#000;display:flex;flex-direction:column;gap:0}
.i.calic small{font-size:10px;color:#ff3b30;font-weight:700;line-height:1;margin-top:9px}.i.calic span{font-size:30px;font-weight:300;line-height:1.1}
.dock{position:absolute;bottom:24px;left:14px;right:14px;height:96px;border-radius:34px;background:rgba(255,255,255,.28);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);display:flex;justify-content:space-around;align-items:center}
.dock .ic span:last-child:not(.i){display:none}
.dots{display:flex;justify-content:center;gap:8px;position:absolute;bottom:132px;left:0;right:0}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i:first-child{background:#fff}

/* app container */
#app{position:absolute;inset:0;z-index:60;background:#fff;transform:scale(.15);opacity:0;pointer-events:none;border-radius:50px;overflow:hidden;transition:transform .42s cubic-bezier(.25,.8,.25,1),opacity .3s,border-radius .42s}
#app.open{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.pg{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.25,.8,.25,1);box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.pg.in{transform:none}
.pg.under{transform:translateX(-28%)}
.pg.noanim{transition:none}
.pg.blk{background:#000;color:#fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.hdr{padding:58px 16px 8px;flex-shrink:0}
.hdr h1{font-size:34px;font-weight:700;margin:4px 0 10px;letter-spacing:-.3px}
.hdr .tools{display:flex;justify-content:space-between;color:#0a84ff;font-size:17px;min-height:22px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:56px 10px 10px;border-bottom:.5px solid #d8d8dc;background:rgba(248,248,250,.96);flex-shrink:0;position:relative}
.bar .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none;bottom:12px}
.back{color:#0a84ff;font-size:17px;cursor:pointer;display:flex;align-items:center;gap:3px;min-width:60px;position:relative;z-index:1}
.back:before{content:"";width:11px;height:11px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);border-radius:2px;margin-right:2px}
.search{background:#eeeef0;border-radius:11px;padding:8px 10px;color:#8e8e93;font-size:16px;margin-bottom:6px}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-30px);background:rgba(30,30,30,.88);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* messages */
.row{display:flex;align-items:center;gap:12px;padding:0 0 0 22px;cursor:pointer;position:relative}
.row:active{background:#f0f0f2}
.row .dot{position:absolute;left:7px;top:50%;width:10px;height:10px;border-radius:50%;background:#0a84ff;margin-top:-5px}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:25px;flex-shrink:0;color:#fff;background-size:cover;background-position:center}
.rt{flex:1;min-width:0;padding:11px 14px 11px 0;border-bottom:.5px solid #e2e2e6}
.rn{display:flex;justify-content:space-between;align-items:baseline}.rn b{font-size:16px}.rn span{font-size:14px;color:#8e8e93}
.rp{font-size:15px;color:#8e8e93;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.chathd{flex-direction:column;align-items:stretch}
.chathd .who{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;position:absolute;left:0;right:0;bottom:8px;pointer-events:none}
.chathd .who .av{width:52px;height:52px;font-size:26px}
.chathd{padding-bottom:96px}
.msgs{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.b{max-width:74%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.32;word-break:break-word;animation:pop .25s}
.b.me{align-self:flex-end;background:#0a84ff;color:#fff}
.b.ot{align-self:flex-start;background:#e9e9eb}
.b.me+.b.ot,.b.ot+.b.me{margin-top:8px}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sep{text-align:center;font-size:12px;color:#8e8e93;margin:14px 0 6px}.sep b{font-weight:600}
.b.img{padding:0;width:190px;height:230px;display:grid;place-items:center;font-size:60px;overflow:hidden;background-size:cover;background-position:center}
.b.voice{display:flex;align-items:center;gap:10px;cursor:pointer}
.wave{display:flex;gap:2px;align-items:center;height:22px}.wave i{width:3px;border-radius:2px;background:currentColor;opacity:.85}
.b.voice.playing .wave i{animation:wv .6s ease-in-out infinite alternate}
@keyframes wv{to{transform:scaleY(.3)}}
.read{align-self:flex-end;font-size:11px;color:#8e8e93;margin:2px 4px 0}
.typing{display:flex;gap:4px;padding:13px 15px}.typing i{width:8px;height:8px;border-radius:50%;background:#999;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:.3;transform:translateY(-3px)}}
.inbar{display:flex;gap:8px;padding:8px 10px 34px;border-top:.5px solid #e0e0e4;align-items:center;flex-shrink:0;background:#fff}
.inbar .plus{width:34px;height:34px;border-radius:50%;background:#eeeef0;display:grid;place-items:center;font-size:22px;color:#777}
.inbar input{flex:1;border:1px solid #d1d1d6;border-radius:19px;padding:8px 14px;font-size:16px;outline:none;font-family:inherit;min-width:0}
.send{width:32px;height:32px;border-radius:50%;background:#0a84ff;color:#fff;border:0;font-size:17px;cursor:pointer;flex-shrink:0}

/* instagram */
.igbar{display:flex;justify-content:space-between;align-items:center;padding:58px 16px 8px;flex-shrink:0}
.igbar b{font-size:22px;letter-spacing:-.3px}.igbar span{font-size:24px;letter-spacing:12px}
.igp{display:flex;align-items:center;gap:22px;padding:8px 16px}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);cursor:pointer}
.ring.seen{background:#ddd}
.ring>div{border:3px solid #fff;border-radius:50%}
.igp .av{width:84px;height:84px;font-size:40px}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center}.stats b{display:block;font-size:17px}.stats span{font-size:13px}
.bio{padding:4px 16px 10px;font-size:14px;line-height:1.4;white-space:pre-line}
.igbtns{display:flex;gap:6px;padding:0 16px 12px}.igbtns span{flex:1;background:#efefef;border-radius:8px;text-align:center;padding:7px;font-size:14px;font-weight:600}
.hls{display:flex;gap:16px;padding:4px 16px 14px;overflow-x:auto;scrollbar-width:none}
.hl{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;cursor:pointer;flex-shrink:0}
.hl .c{width:66px;height:66px;border-radius:50%;border:1px solid #ddd;padding:3px}.hl .c>div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:28px;background-size:cover;background-position:center}
.igtabs{display:flex;border-top:.5px solid #ddd}.igtabs span{flex:1;text-align:center;padding:10px;font-size:20px;opacity:.4}.igtabs span:first-child{opacity:1;border-bottom:1.5px solid #000}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.g3>div{aspect-ratio:1;display:grid;place-items:center;font-size:42px;cursor:pointer;background-size:cover;background-position:center;position:relative}
.g3>div .hrt{position:absolute;bottom:4px;left:6px;font-size:14px}
.post .ph{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:110px;background-size:cover;background-position:center}
.post .bigh{position:absolute;font-size:100px;opacity:0;transform:scale(.4);pointer-events:none}
.post .bigh.go{animation:bh .9s}
@keyframes bh{30%{opacity:1;transform:scale(1.1)}60%{transform:scale(.95);opacity:1}100%{opacity:0;transform:scale(1)}}
.post .ph-hd{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}.post .ph-hd .av{width:34px;height:34px;font-size:16px}
.acts{display:flex;gap:16px;padding:10px 14px 6px;font-size:25px}.acts span{cursor:pointer}.acts .bm{margin-left:auto}
.pc{padding:0 14px;font-size:14px;line-height:1.45}.pc .cm{margin-top:4px}.pc small{color:#8e8e93;display:block;margin:8px 0 20px;font-size:12px}
.story{position:absolute;inset:0;z-index:20;background:#111;color:#fff;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.story .bars{position:absolute;top:56px;left:10px;right:10px;display:flex;gap:4px;z-index:2}
.story .bars i{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .sh{position:absolute;top:68px;left:14px;right:14px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:2}
.story .sh .av{width:32px;height:32px;font-size:16px}.story .sh .x{margin-left:auto;font-size:26px;cursor:pointer;padding:4px}
.story .img{position:absolute;inset:0;display:grid;place-items:center;font-size:130px;background-size:cover;background-position:center}
.story .cap{position:absolute;bottom:110px;left:0;right:0;text-align:center;font-size:20px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.story .rep{position:absolute;bottom:36px;left:14px;right:14px;border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:11px 16px;font-size:14px;opacity:.8}

/* photos */
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ph-grid>div{aspect-ratio:1;display:grid;place-items:center;font-size:40px;background-size:cover;background-position:center;cursor:pointer;position:relative}
.ph-grid>div .fv{position:absolute;bottom:3px;left:5px;font-size:12px;color:#fff}
.tabbar{display:flex;justify-content:space-around;padding:8px 0 30px;border-top:.5px solid #ddd;background:rgba(250,250,250,.96);font-size:10px;color:#999;flex-shrink:0}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.tabbar span i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
.tabbar span.on{color:#0a84ff}.tabbar span.on i{filter:none;opacity:1}
.viewer{flex:1;display:grid;place-items:center;position:relative}
.viewer .img{width:100%;aspect-ratio:3/4;display:grid;place-items:center;font-size:130px;background-size:contain;background-repeat:no-repeat;background-position:center}
.viewer .nav{position:absolute;top:0;bottom:0;width:35%}.viewer .nav.l{left:0}.viewer .nav.r{right:0}
.vcap{text-align:center;font-size:15px;padding:8px}
.vbar{display:flex;justify-content:space-around;padding:12px 0 36px;font-size:24px}.vbar span{cursor:pointer}

/* camera */
.cam{flex:1;position:relative;background:#000;overflow:hidden;margin-top:100px}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .nocam{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#888;font-size:14px;line-height:1.6;padding:20px}
.cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .flash.go{animation:fl .4s}
@keyframes fl{0%{opacity:1}}
.camtop{position:absolute;top:56px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;font-size:20px;color:#fff}
.modes{display:flex;justify-content:center;gap:22px;font-size:13px;font-weight:600;color:#fff;padding:14px 0 6px;letter-spacing:.5px}.modes .on{color:#ffcc00}
.shut{display:flex;justify-content:space-between;align-items:center;padding:14px 34px 46px}
.shut .th{width:50px;height:50px;border-radius:9px;background:#333;background-size:cover;background-position:center;display:grid;place-items:center;font-size:24px;cursor:pointer;border:2px solid #222}
.shut .btn{width:76px;height:76px;border-radius:50%;border:4px solid #fff;padding:4px;cursor:pointer}.shut .btn i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
.shut .btn:active i{transform:scale(.88)}
.shut .flip{width:50px;height:50px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:22px;color:#fff}

/* facetime */
.ftbtns{display:flex;gap:10px;padding:0 16px 14px}.ftbtns span{flex:1;border-radius:12px;padding:12px;font-size:15px;font-weight:600;text-align:center;cursor:pointer}
.ftbtns .a{background:#eeeef0;color:#0a84ff}.ftbtns .b2{background:#34c759;color:#fff}
.ftrow{display:flex;align-items:center;gap:12px;padding:0 0 0 16px;cursor:pointer}
.ftrow .rt{display:flex;justify-content:space-between;align-items:center}
.ftrow .rt div b{font-size:16px;display:block}.ftrow .rt div span{font-size:14px;color:#8e8e93}.ftrow .rt>span{font-size:14px;color:#8e8e93}
.ftrow .miss b{color:#ff3b30}
.ftlab{font-size:20px;font-weight:700;padding:12px 16px 6px}
#call{position:absolute;inset:0;z-index:85;background:#222;color:#fff;display:none}
#call.on{display:block;animation:fadein .3s}
#call .big{position:absolute;inset:0;display:grid;place-items:center;background-size:cover;background-position:center}
#call .big video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#call .big .ph{text-align:center;font-size:15px;opacity:.7;line-height:1.7}
#call .pip{position:absolute;top:66px;right:14px;width:108px;height:160px;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.4);display:grid;place-items:center;font-size:48px;background-size:cover;background-position:center;z-index:2}
#call .pip video,#call .pip img{width:100%;height:100%;object-fit:cover}
#call .ci{position:absolute;top:66px;left:20px;z-index:2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#call .ci b{font-size:26px;display:block}#call .ci span{font-size:15px;opacity:.85}
#call .ctl{position:absolute;bottom:40px;left:16px;right:16px;background:rgba(40,40,40,.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:28px;padding:16px;display:flex;justify-content:space-around;z-index:2}
#call .ctl span{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;cursor:pointer}
#call .ctl span.off{background:#fff;filter:invert(1)}
#call .ctl .end{background:#ff3b30}
#call .inc{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:110px;background:linear-gradient(#3b3b45,#18181c)}
#call .inc .av{width:110px;height:110px;font-size:54px;margin-bottom:14px}
#call .inc b{font-size:30px}#call .inc span{opacity:.75;margin-top:4px}
#call .inc .ib{position:absolute;bottom:80px;left:50px;right:50px;display:flex;justify-content:space-between;text-align:center;font-size:13px}
#call .inc .ib div{display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer}
#call .inc .ib i{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-style:normal}
.ring-anim{animation:shake 1.2s infinite}
@keyframes shake{0%,40%,100%{transform:none}10%,30%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}}

/* ---------- clock ---------- */
const DAYS=['일','월','화','수','목','금','토'];
function korTime(d){ const h=d.getHours(), m=String(d.getMinutes()).padStart(2,'0'); return `${h<12?'오전':'오후'} ${h%12||12}:${m}`; }
function tick(){
  const d=new Date(), hm=`${d.getHours()%12||12}:${String(d.getMinutes()).padStart(2,'0')}`;
  $('#sbt').textContent=hm; $('#lkt').textContent=hm;
  $('#lkd').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
  $('#wcm').textContent=`${DAYS[d.getDay()]}요일`; $('#wcd').textContent=d.getDate();
  const dd=Math.floor((d-new Date(CONFIG.since+'T00:00:00'))/864e5)+1; $('#dday').textContent=`D+${dd}`;
  document.querySelectorAll('[data-tz]').forEach(el=>{
    el.textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:el.dataset.tz,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
  });
}

/* ---------- app router ---------- */
let stack=[], cleanups=[], curApp=null;
function openApp(id, el){
  const A=APPS[id];
  if(!A){ toast('🔒 지훈이만 열 수 있는 앱이에요'); return; }
  const sr=screen.getBoundingClientRect(), k=sr.width/screen.offsetWidth;
  if(el){ const r=el.querySelector('.i').getBoundingClientRect(); appEl.style.transformOrigin=`${(r.left-sr.left+r.width/2)/k}px ${(r.top-sr.top+r.height/2)/k}px`; }
  else appEl.style.transformOrigin='50% 50%';
  runCleanups(); appEl.innerHTML=''; stack=[]; curApp=id;
  const b=$('#bdg-'+id); if(b) b.remove();
  A();
  requestAnimationFrame(()=>appEl.classList.add('open'));
  $('#home').classList.add('behind');
}
function closeApp(){
  if(!curApp) return;
  appEl.classList.remove('open'); $('#home').classList.remove('behind'); setUI('light');
  runCleanups(); curApp=null;
  setTimeout(()=>{ if(!curApp) appEl.innerHTML=''; },420);
}
function runCleanups(){ cleanups.forEach(f=>{try{f()}catch(e){}}); cleanups=[]; }
function push(html, opt={}){
  const pg=document.createElement('div');
  pg.className='pg '+(opt.cls||''); pg.innerHTML=html; pg.dataset.ui=opt.ui||'dark';
  appEl.appendChild(pg);
  const prev=stack[stack.length-1];
  if(!prev){ pg.classList.add('noanim','in'); requestAnimationFrame(()=>pg.classList.remove('noanim')); }
  else { pg.getBoundingClientRect(); pg.classList.add('in'); prev.classList.add('under'); }
  stack.push(pg); setUI(pg.dataset.ui);
  if(opt.mount) opt.mount(pg);
  if(opt.cleanup) pg._cleanup=opt.cleanup;
  return pg;
}
function pop(){
  if(stack.length<2) return closeApp();
  const pg=stack.pop(), prev=stack[stack.length-1];
  if(pg._cleanup) pg._cleanup();
  pg.classList.remove('in'); prev.classList.remove('under'); setUI(prev.dataset.ui);
  if(prev._refresh) prev._refresh();
  setTimeout(()=>pg.remove(),400);
}
const backBtn = (label='') => `<span class="back" onclick="pop()">${label}</span>`;

const APPS = {msg:msgApp, insta:igApp, photos:photosApp, camera:cameraApp, facetime:ftApp, notes:notesApp, clock:clockApp, memo:memoApp};

function lastText(c){ const m=[...c.msgs].reverse().find(m=>!m.sep); return m.img!=null?'사진':m.voice?'음성 메시지':m.t; }
function lastTime(c){ const s=[...c.msgs].reverse().find(m=>m.sep); if(!s) return ''; const w=s.sep.replace(/\s*\(.\)/,'').split(' ');
  return w[0]==='오늘' ? w.slice(-2).join(' ') : w[0]==='어제' ? '어제' : w.slice(0,2).join(' '); }
function msgApp(){
  const pg=push(`<div class="hdr"><div class="tools"><span>편집</span><span>✎</span></div><h1>메시지</h1><div class="search">🔍 검색</div></div><div class="body" id="mlist"></div>`);
  const render=()=>{ pg.querySelector('#mlist').innerHTML = CHATS.map((c,i)=>`<div class="row" onclick="chatRoom(${i})">${c.unread?'<i class="dot"></i>':''}
    <div class="av" style="background:${c.bg}">${c.av}</div><div class="rt"><div class="rn"><b>${c.name}</b><span>${lastTime(c)} ›</span></div><div class="rp">${esc(lastText(c))}</div></div></div>`).join(''); };
  render(); pg._refresh=render;
}
function bubble(m){
  if(m.sep) return `<div class="sep"><b>${m.sep.split(' ').slice(0,-2).join(' ')}</b> ${m.sep.split(' ').slice(-2).join(' ')}</div>`;
  const who=m.me?'me':'ot';
  if(m.img!=null){ const p=PHOTOS[m.img]; return `<div class="b ${who} img" style="${phStyle(p,m.img)}" onclick="photoViewer(${m.img})">${phInner(p)}</div>`; }
  if(m.voice){ const bars=Array.from({length:22},()=>`<i style="height:${4+Math.random()*16}px"></i>`).join(''); return `<div class="b ${who} voice" onclick="this.classList.toggle('playing')">▶<span class="wave">${bars}</span>${m.voice}</div>`; }
  return `<div class="b ${who}">${esc(m.t)}</div>`;
}
function chatRoom(i){
  const c=CHATS[i]; c.unread=false;
  const pg=push(`<div class="bar chathd">${backBtn()}<div class="who"><div class="av" style="background:${c.bg}">${c.av}</div><span>${c.name} ›</span></div></div>
    <div class="body"><div class="msgs">${c.msgs.map(bubble).join('')}${c.msgs[c.msgs.length-1].me?'<div class="read">읽음</div>':''}</div></div>
    <div class="inbar"><span class="plus">+</span><input placeholder="iMessage" enterkeyhint="send"><button class="send">↑</button></div>`);
  const body=pg.querySelector('.body'), box=pg.querySelector('.msgs'), inp=pg.querySelector('input');
  body.scrollTop=body.scrollHeight;
  let timers=[];
  const send=()=>{
    const v=inp.value.trim(); if(!v) return; inp.value='';
    pg.querySelector('.read')?.remove();
    c.msgs.push({me:1,t:v}); box.insertAdjacentHTML('beforeend', bubble({me:1,t:v})); body.scrollTop=body.scrollHeight;
    timers.push(setTimeout(()=>{ box.insertAdjacentHTML('beforeend','<div class="b ot typing"><i></i><i></i><i></i></div>'); body.scrollTop=body.scrollHeight; },900));
    timers.push(setTimeout(()=>{ pg.querySelector('.typing')?.remove(); const r=c.replies[Math.floor(Math.random()*c.replies.length)];
      c.msgs.push({t:r}); box.insertAdjacentHTML('beforeend', bubble({t:r})); body.scrollTop=body.scrollHeight; },2400));
  };
  pg.querySelector('.send').onclick=send;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing) send(); });
  pg._cleanup=()=>timers.forEach(clearTimeout);
}

    <div class="shut"><div class="th"></div><div class="btn"><i></i></div><div class="flip">⟲</div></div>`,{cls:'blk',ui:'light'});

  getCam().then(s=>{ if(curApp!=='camera'){ s?.getTracks().forEach(t=>t.stop()); return; } stream=s;

  pg.querySelector('.btn').onclick=()=>{
    const f=pg.querySelector('.flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    if(!stream||!v.videoWidth) return toast('📸 찰칵! (카메라가 꺼져 있어요)');
    const c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight; const x=c.getContext('2d');
    x.translate(c.width,0); x.scale(-1,1); x.drawImage(v,0,0);

  };
  cleanups.push(()=>stream?.getTracks().forEach(t=>t.stop()));
}

let callTimer=null, callStream=null;
function startCall(i, incoming){
  const f=FT[i]||FT[0]; const call=$('#call');
  const pipMedia = CONFIG.selfie ? (/\.(mp4|webm|mov)$/i.test(CONFIG.selfie) ? `<video src="${CONFIG.selfie}" autoplay loop muted playsinline></video>` : `<img src="${CONFIG.selfie}">`) : '🎹';
  call.innerHTML=`<div class="big" style="background:${f.bg}"><div class="ph">${f.av}<br>카메라 연결 중…</div></div>
    <div class="pip" style="${CONFIG.selfie?'background:#000':'background:linear-gradient(135deg,#ffd6e0,#b79cff)'}">${pipMedia}</div>
    <div class="ci"><b>${f.n}</b><span class="cs">${incoming?'':'연결 중…'}</span></div>
    <div class="ctl"><span onclick="this.classList.toggle('off')">🔇</span><span onclick="this.classList.toggle('off')">📷</span><span onclick="toast('😊 효과는 준비 중')">✨</span><span class="end" onclick="endCall()">✕</span></div>
    ${incoming?`<div class="inc"><div class="av" style="background:${f.bg}">${f.av}</div><b>${f.n}</b><span>FaceTime 비디오…</span>
      <div class="ib"><div onclick="endCall()"><i style="background:#ff3b30">✕</i>거절</div><div onclick="acceptCall()"><i style="background:#34c759" class="ring-anim">📹</i>수락</div></div></div>`:''}`;
  call.classList.add('on'); setUI('light');
  if(!incoming) acceptCall();
}
function acceptCall(){
  const call=$('#call'); call.querySelector('.inc')?.remove();
  const cs=call.querySelector('.cs'); cs.textContent='연결 중…';
  getCam().then(s=>{ if(!call.classList.contains('on')){ s?.getTracks().forEach(t=>t.stop()); return; } callStream=s; const big=call.querySelector('.big');
    if(s){ big.innerHTML='<video autoplay playsinline muted></video>'; big.querySelector('video').srcObject=s; }
    else big.querySelector('.ph').innerHTML+='<br><small>(카메라 권한을 허용하면 내 얼굴이 떠요)</small>'; });
  let sec=0; clearInterval(callTimer);
  setTimeout(()=>{ if(!call.classList.contains('on')) return; callTimer=setInterval(()=>{ sec++; cs.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; },1000); },2200);
}
function endCall(){
  clearInterval(callTimer); callStream?.getTracks().forEach(t=>t.stop()); callStream=null;
  const call=$('#call'); call.classList.remove('on'); call.innerHTML='';
  setUI(curApp ? (stack[stack.length-1]?.dataset.ui||'dark') : 'light');
}
function incomingBanner(){
  if($('#call').classList.contains('on')) return setTimeout(incomingBanner,20000);
  const b=$('#banner');
  b.innerHTML=`<div class="av" style="background:${CHATS[0].bg}">${CONFIG.partnerEmoji}</div><div><b>${CONFIG.partner}</b><span>FaceTime 비디오</span></div>
    <i style="background:#ff3b30" onclick="hideBanner()">✕</i><i style="background:#34c759" onclick="hideBanner();startCall(0,true)">📹</i>`;
  b.classList.add('show'); b._t=setTimeout(hideBanner,9000);
}
function hideBanner(){ const b=$('#banner'); clearTimeout(b._t); b.classList.remove('show'); }

/* ---------- 메모 ---------- */
function notesApp(){
  push(`<div class="hdr"><div class="tools"><span class="back" style="color:#e0a800">폴더</span><span style="color:#e0a800">⋯</span></div><h1>메모</h1><div class="search">🔍 검색</div></div>
    <div class="body"><div class="nlab">📌 고정됨</div><div class="ncard">${NOTES.slice(0,2).map((n,i)=>noteRow(n,i)).join('')}</div>
    <div class="nlab">이전 30일</div><div class="ncard">${NOTES.slice(2).map((n,i)=>noteRow(n,i+2)).join('')}</div></div>`,{cls:'notes'});
}
const noteRow=(n,i)=>`<div class="nrow" onclick="noteView(${i})"><b>${n.t}</b><span>${n.d}&nbsp;&nbsp;${esc(n.b.split('\n')[0])}</span></div>`;
function noteView(i){
  const n=NOTES[i];
  push(`<div class="bar" style="background:#fff;border:0">${backBtn('메모')}<span style="color:#e0a800;font-size:20px">⋯</span></div>
    <div class="body"><div class="ndate">${n.d}</div><div class="ntext" contenteditable="true" spellcheck="false"><h2>${n.t}</h2>${esc(n.b)}</div></div>`,{cls:'note'});
}

/* ---------- 시계 ---------- */
function clockApp(){
  const pg=push(`<div class="hdr"><div class="tools"><span>편집</span><span>＋</span></div><h1></h1></div><div class="body ckb"></div>
    <div class="tabbar"><span data-t="w"><i>🌐</i>세계 시계</span><span class="on" data-t="a"><i>⏰</i>알람</span><span data-t="s"><i>⏱️</i>스톱워치</span><span data-t="x"><i>⏲️</i>타이머</span></div>`,{cls:'blk',ui:'light'});
  let swT=null, swStart=0, swAcc=0;
  const tabs={
    a(){ pg.querySelector('h1').textContent='알람';
      pg.querySelector('.ckb').innerHTML=ALARMS.map((a,i)=>`<div class="ckrow ${a.on?'':'off'}"><div><div class="t"><small style="font-size:26px">${a.ap}</small> ${a.t}</div><div class="l">${a.l}</div></div><div class="sw ${a.on?'on':''}" data-i="${i}"></div></div>`).join('');
      pg.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{ const a=ALARMS[s.dataset.i]; a.on=!a.on; s.classList.toggle('on',a.on); s.parentElement.classList.toggle('off',!a.on); }); },
    w(){ pg.querySelector('h1').textContent='세계 시계';
      pg.querySelector('.ckb').innerHTML=[['서울','Asia/Seoul','오늘'],['도쿄','Asia/Tokyo','오늘, +0시간'],['로스앤젤레스','America/Los_Angeles','-16시간'],['뉴욕','America/New_York','-13시간']]
        .map(c=>`<div class="ckrow wc"><div><div class="l">${c[2]}</div><div style="font-size:24px">${c[0]}</div></div><div class="t" data-tz="${c[1]}"></div></div>`).join(''); tick(); },
    s(){ pg.querySelector('h1').textContent='';
      pg.querySelector('.ckb').innerHTML=`<div class="stopw">00:00.00</div><div class="swb"><span style="background:#333" class="rs">재설정</span><span class="ss" style="background:#0a3a17;color:#34c759">시작</span></div>`;
      const disp=pg.querySelector('.stopw'), ss=pg.querySelector('.ss');
      const fmt=ms=>`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(Math.floor(ms/10)%100).padStart(2,'0')}`;
      const draw=()=>disp.textContent=fmt(swAcc+(swT?Date.now()-swStart:0)); draw();
      const style=()=>{ ss.textContent=swT?'중단':'시작'; ss.style.background=swT?'#3a0f0c':'#0a3a17'; ss.style.color=swT?'#ff453a':'#34c759'; }; style();
      ss.onclick=()=>{ if(swT){ swAcc+=Date.now()-swStart; clearInterval(swT); swT=null; } else { swStart=Date.now(); swT=setInterval(draw,33); } style(); draw(); };
      pg.querySelector('.rs').onclick=()=>{ if(swT) return; swAcc=0; draw(); }; },
    x(){ toast('⏲️ 라면 3분 타이머는 자기가 맞춰줘요'); return false; }
  };
  pg.querySelectorAll('.tabbar span').forEach(s=>s.onclick=()=>{ if(tabs[s.dataset.t]()===false) return; pg.querySelectorAll('.tabbar span').forEach(x=>x.classList.toggle('on',x===s)); });
  tabs.a();
  cleanups.push(()=>clearInterval(swT));
}

/* ---------- 음성 메모 ---------- */
function memoApp(){
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const pg=push(`<div class="hdr"><div class="tools"><span>〈 전체</span><span>편집</span></div><h1>음성 메모</h1><div class="search">🔍 검색</div></div>
    <div class="body">${MEMOS.map((m,i)=>`<div class="vm" data-i="${i}"><b>${m.t}</b><div class="meta"><span>${m.d}</span><span>${fmt(m.len)}</span></div>
      <div class="pl"><div class="prog"><i></i></div><div class="meta"><span class="cur">0:00</span><span>-${fmt(m.len)}</span></div><div class="pbtn"><span>↺</span><span class="pp">▶</span><span>↻</span></div></div></div>`).join('')}</div>
    <div class="recbtn" onclick="toast('🎙️ 녹음은 지훈이만…')"><i></i></div>`);
  let timer=null, cur=null;
  const stop=()=>{ clearInterval(timer); timer=null; if(cur) cur.querySelector('.pp').textContent='▶'; };
  pg.querySelectorAll('.vm').forEach(el=>{
    el.onclick=e=>{
      const m=MEMOS[el.dataset.i];
      if(!el.classList.contains('open')){ stop(); pg.querySelectorAll('.vm').forEach(x=>x.classList.remove('open')); el.classList.add('open'); cur=el; el._s=el._s||0; return; }
      if(!e.target.classList.contains('pp')) return;
      if(timer){ stop(); return; }
      el.querySelector('.pp').textContent='❚❚';
      timer=setInterval(()=>{ el._s=Math.min(m.len,(el._s||0)+.1);
        el.querySelector('.prog i').style.width=(el._s/m.len*100)+'%'; el.querySelector('.cur').textContent=fmt(Math.floor(el._s));
        if(el._s>=m.len){ el._s=0; stop(); } },100);
    };
  });
  cleanups.push(stop);
}

/* ---------- start ---------- */
function fit(){ const p=$('.phone'); if(innerWidth<=500){ p.style.transform=''; return; } p.style.transform=`scale(${Math.min(1,(innerHeight-24)/868,(innerWidth-24)/414)})`; }
addEventListener('resize',fit); fit();
tick(); setInterval(tick,1000);
</script>
